name: Bug report
description: Something in the plugin does not work as documented.
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Security vulnerabilities go through the [security policy](https://github.com/rokmohar/medusa-plugin-meilisearch/security/policy), not here.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. Include error messages and logs.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: A minimal sequence of steps, requests or code that triggers the bug.
      placeholder: |
        1. Declare the index with ...
        2. Call GET /store/meilisearch/products?query=...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: The plugin and Search Module entries from medusa-config.ts, and your index declarations under src/search. Remove secrets.
      render: ts
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: 2.4.0
    validations:
      required: true
  - type: input
    id: medusa-version
    attributes:
      label: Medusa version
      placeholder: 2.22.1
    validations:
      required: true
  - type: input
    id: meilisearch-version
    attributes:
      label: Meilisearch server version
      placeholder: 1.53.0
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: 22.12.0
